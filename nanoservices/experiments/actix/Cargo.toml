[package]
name = "actix"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1.36.0", features = ["full"] }
actix-web = "4.5.1"
actix-runtime = { package = "actix", version = "0.13.5" }
actix-web-actors = "4.3.1"
actix-cors = "0.6"  
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rumqttc = { version = "0.24", features = ["url", "websocket"] }

serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"

coremod = { path = "../coremod"}
dal = { path = "../dal/", features = ["sqlx-postgres"]}
glue = { path = "../../../glue", features = ["actix"]}

auth-dal = { path = "../../auth/dal"}
auth_actix_server = { path = "../../auth/actix"}
